[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-attestation-data-release"
version = "0.1.0"
description = "Policy-driven backend for releasing data after remote attestation"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=42",
  "fastapi>=0.116,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
